name: Publish to npm

# =============================================================================
# 通用模板：GitHub Release -> npm 同步发布
#
# 换项目使用时：把这份文件复制到目标仓库的 .github/workflows/ 即可，无需改动。
# 需要准备的东西只有两样：
#   1. package.json 里有 name / version，且没有 "private": true（带 scope 的包还要
#      publishConfig.access = "public"）；
#   2. 认证二选一 —— 仓库 secret NPM_TOKEN，或 npm 上给这个包配 GitHub Actions
#      trusted publisher（owner / 仓库名 / workflow 文件名 publish-npm.yml）。
#
# ⚠️ npm 发布不可逆。一个版本号一旦发布过，就永远绑定那一次发布：
#    `npm unpublish` 也不会释放那个版本号，任何人都不能再用同一个
#    name@version 重新发布。所以：内容有变化 -> 先在 package.json 里
#    提升 version -> 提交 -> 用同一个号打 tag / 建 Release -> 才能发。
#    不要指望"删掉再重发"去覆盖一个已经发出去的版本。
#
# 触发：release published（主路径）+ workflow_dispatch（手动补发/重试）。
# 认证：有 NPM_TOKEN secret 就用 token；没有就走 OIDC trusted publishing。
#       两条分支都是"真的去发布"，不是静默跳过：两者都没配时 npm 会拒绝
#       认证，发布步骤红掉并打印两条可执行的修复路径。
# 产物：npm pack 出来的 .tgz 同时上传到同一个 GitHub Release。
# =============================================================================

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.7.1). Leave empty to use the ref this run started from.'
        required: false
        type: string

permissions:
  # contents: write 用于把 .tgz 附加到 Release；id-token: write 用于 npm
  # provenance / trusted publishing 的 OIDC 令牌。缺了 id-token，
  # --provenance 会失败，trusted publishing 也无法认证。
  contents: write
  id-token: write

# 同一个版本绝不允许两次发布并行：宁可排队，也不要两个 job 抢同一个版本号。
concurrency:
  group: publish-npm-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          # release 事件用 release 的 tag；手动触发优先用输入的 tag，
          # 最后才回落到当前 ref（从分支触发时版本闸门会因此失败，这是故意的）。
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node and the npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Locate the package directory
        # 同一套探测逻辑兼容两种布局：包在仓库根，或包在 pkg/ 子目录。
        # 换到别的项目时这一行不用改。
        shell: pwsh
        run: |
          if (Test-Path 'pkg/package.json') {
            "PKG_DIR=pkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "PKG_DIR=." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          Write-Host "package directory: $env:PKG_DIR"

      - name: Version consistency gate
        # 发布前先对齐两件事：Release 的 tag 与 package.json 的 version。
        # 两边不一致就直接失败，因为发出去的版本号不可撤销。
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:PKG_DIR

          $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $name = $pkg.name
          $version = $pkg.version

          if (-not $name) {
            Write-Host "::error::package.json has no name; there is nothing publishable."
            exit 1
          }
          if (-not $version) {
            Write-Host "::error::package.json has no version; there is nothing publishable."
            exit 1
          }
          if ($pkg.private -eq $true) {
            Write-Host "::error::${name} is marked private:true in package.json, and npm refuses to publish a private package."
            Write-Host "Fix: remove the private field (or set it to false), commit, then re-create the Release."
            exit 1
          }

          $tag = $env:RELEASE_TAG
          if (-not $tag) {
            Write-Host "::error::no release tag is available for this run."
            Write-Host "Fix: trigger this workflow from a GitHub Release (release: published), or run it manually from a tag ref."
            exit 1
          }

          # tag 允许写成 v1.2.3 或 1.2.3；比较时只去掉一个前导 v。
          $tagVersion = ($tag -replace '^v', '').Trim()

          if ($tagVersion -ne $version) {
            Write-Host "::error::version mismatch. Release tag is '${tag}' (version '${tagVersion}') but package.json says '${version}'."
            Write-Host "Both sides must match exactly before anything is published."
            Write-Host "Fix one of these, then re-run:"
            Write-Host "  a) bump version in package.json to '${tagVersion}', commit, move the tag to the new commit and re-create the Release;"
            Write-Host "  b) or create a new tag/Release whose name, minus the leading v, is '${version}'."
            exit 1
          }

          Write-Host "tag/version check OK: ${name}@${version} (from tag '${tag}')"
          "name=${name}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=${version}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Idempotency gate (is this version already on npm?)
        # 已存在就跳过发布，让"手动重跑"变成幂等操作。但"查不到"必须真的是
        # 404/E404 —— 网络故障、registry 5xx、认证错误都必须让 job 红掉，
        # 绝不能因为一次网络抖动就把"查不到"当成"版本不存在"。
        id: exists
        shell: pwsh
        env:
          PKG_NAME: ${{ steps.version.outputs.name }}
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $name = $env:PKG_NAME
          $version = $env:PKG_VERSION
          Write-Host "checking whether ${name}@${version} already exists on npm"

          $raw = & npm view "${name}@${version}" version 2>&1
          $code = $LASTEXITCODE
          $text = ($raw | Out-String)

          if ($code -eq 0) {
            Write-Host "::notice::npm already has ${name}@${version}; the publish steps are skipped (this run is idempotent)."
            "already=1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $notFound = ($text -match 'E404') -or ($text -match 'is not in this registry') -or ($text -match '404 Not Found')
          if ($notFound) {
            Write-Host "${name}@${version} is not on npm yet - continuing with pack and publish."
            "already=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          Write-Host "::error::could not query npm for ${name}@${version}, and the error is NOT a 404."
          Write-Host "This is a registry/network/auth failure, not a missing version, so publishing is refused."
          Write-Host $text
          Write-Host "Next: check https://status.npmjs.org and your network, then re-run this job."
          exit 1

      - name: Resolve the npm authentication mode
        # 认证方式在这里一次性判定，后面的两个发布步骤只读输出。
        # `secrets` 上下文不能写在 if: 里（GitHub 只允许 github/needs/
        # strategy/matrix/job/runner/env/vars/steps/inputs），所以做法是：
        # 把这个 secret 当一个普通环境变量交给 shell，在 shell 里判空。
        # 空 secret 在 env 里就是一个空字符串，判空是可靠的；token 的值
        # 全程不会被打印、也不会被写进任何输出文件。
        id: npm-auth
        if: steps.exists.outputs.already != '1'
        shell: pwsh
        env:
          NPM_TOKEN_PROBE: ${{ secrets.NPM_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NPM_TOKEN_PROBE)) {
            Write-Host "NPM_TOKEN secret is absent or empty -> OIDC trusted publishing"
            "mode=oidc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "NPM_TOKEN secret is present -> token authentication"
            "mode=token" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: npm pack
        id: pack
        if: steps.exists.outputs.already != '1'
        shell: pwsh
        env:
          # 某些机器上 npm 默认缓存目录不可写；指到 runner 的临时目录。
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location $env:PKG_DIR
          Write-Host "packing from $((Get-Location).Path)"

          $jsonText = (& npm pack --json) -join "`n"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::npm pack failed; there is no tarball to publish or upload."
            Write-Host $jsonText
            exit 1
          }

          # `npm pack --json` 的输出形状随 npm 版本变过：npm <=11 是数组，
          # 只打一个包时也可能直接是对象；npm 12 是"以包名为 key 的对象"。
          # 三种都认，免得换了个 npm 版本这一步就炸。
          $parsed = $jsonText | ConvertFrom-Json
          if ($parsed -is [System.Array]) {
            $entry = $parsed[0]
          } elseif ($parsed.PSObject.Properties['filename']) {
            $entry = $parsed
          } else {
            $entry = @($parsed.PSObject.Properties)[0].Value
          }
          if (-not $entry.filename) {
            Write-Host "::error::could not find the tarball name in the npm pack report."
            Write-Host $jsonText
            exit 1
          }

          $tgz = Join-Path (Get-Location).Path $entry.filename
          if (-not (Test-Path -LiteralPath $tgz)) {
            Write-Host "::error::npm pack reported a tarball that does not exist on disk: $tgz"
            exit 1
          }

          Write-Host "tarball: $tgz ($((Get-Item -LiteralPath $tgz).Length) B, $($entry.files.Count) files)"
          "file=$tgz" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # ---- 分支 1：仓库里配了 NPM_TOKEN ----------------------------------
      # NODE_AUTH_TOKEN 只在这一条步骤里设置，另一个分支根本不设置。
      - name: Publish with the NPM_TOKEN secret
        if: steps.npm-auth.outputs.mode == 'token' && steps.exists.outputs.already != '1'
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          npm_config_cache: ${{ runner.temp }}/npm-cache
          TARBALL: ${{ steps.pack.outputs.file }}
          PKG_NAME: ${{ steps.version.outputs.name }}
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          if (-not (Test-Path -LiteralPath $env:TARBALL)) {
            Write-Host "::error::the packed tarball is missing; re-run the pack step."
            exit 1
          }

          Write-Host "publishing ${env:PKG_NAME}@${env:PKG_VERSION} with token authentication"
          $raw = & npm publish $env:TARBALL --access public --provenance 2>&1
          $code = $LASTEXITCODE
          Write-Host ($raw | Out-String)

          if ($code -ne 0) {
            Write-Host "::error::npm publish failed with token authentication (exit ${code}). Nothing was published."
            Write-Host "Most likely causes and fixes:"
            Write-Host "  - 401 Unauthorized : NPM_TOKEN is expired, revoked or wrong. Create a new Granular Access Token (read+write, public packages) and update the repo secret NPM_TOKEN."
            Write-Host "  - 403 Forbidden    : the token may not publish this scope. Check the token's package scope and the package's publishing access settings on npmjs.com."
            Write-Host "  - E409/E422        : that exact version already exists. Raise version in package.json; a version number cannot be reused."
            Write-Host "  - provenance error : --provenance needs a public repository plus id-token: write (this workflow has it)."
            exit 1
          }
          Write-Host "${env:PKG_NAME}@${env:PKG_VERSION} is published to npm."

      # ---- 分支 2：没有 NPM_TOKEN，走 OIDC trusted publishing -------------
      # 这条分支不是"跳过"，它真的发布：npm 上没配 trusted publisher 时，
      # npm 会拒绝认证，这里红掉并打印两条修复路径（含本仓库与 workflow 名）。
      - name: Publish with OIDC trusted publishing (no token)
        if: steps.npm-auth.outputs.mode == 'oidc' && steps.exists.outputs.already != '1'
        shell: pwsh
        env:
          # 这里故意【不】声明 NODE_AUTH_TOKEN：npm 判断"要不要走 OIDC"是看
          # 有没有 token 来源。声明成空串可能被展开成"空 token"而触发 401，
          # 所以下面在 shell 里显式删掉这个环境变量，并把 setup-node 写的
          # .npmrc 里那行 _authToken 占位符也去掉。
          npm_config_cache: ${{ runner.temp }}/npm-cache
          TARBALL: ${{ steps.pack.outputs.file }}
          PKG_NAME: ${{ steps.version.outputs.name }}
          PKG_VERSION: ${{ steps.version.outputs.version }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          if (-not (Test-Path -LiteralPath $env:TARBALL)) {
            Write-Host "::error::the packed tarball is missing; re-run the pack step."
            exit 1
          }

          Remove-Item Env:NODE_AUTH_TOKEN -ErrorAction SilentlyContinue

          # setup-node 因为 registry-url 会写一份 .npmrc，里面有
          # `_authToken=${NODE_AUTH_TOKEN}` 占位符。OIDC 模式下这个占位符
          # 会展开成空串，让 npm 以为"有 token 但是空的"。所以这里把
          # _authToken 那一行删掉（只删这一行，绝不打印任何值）。
          try {
            $rcs = @()
            if ($env:GITHUB_WORKSPACE) {
              $rcs += (Join-Path $env:GITHUB_WORKSPACE '.npmrc')
              $rcs += (Join-Path (Join-Path $env:GITHUB_WORKSPACE $env:PKG_DIR) '.npmrc')
            }
            $userRc = (& npm config get userconfig 2>&1 | Out-String).Trim()
            if ($userRc -and $userRc -ne 'undefined') { $rcs += $userRc }
            foreach ($rc in ($rcs | Select-Object -Unique)) {
              if (-not (Test-Path -LiteralPath $rc)) { continue }
              $lines = @(Get-Content -LiteralPath $rc)
              $kept = @($lines | Where-Object { $_ -notmatch '_authToken' })
              if ($kept.Count -eq $lines.Count) { continue }
              # WriteAllLines 写的是无 BOM 的 UTF-8，避免 BOM 破坏首行配置。
              [System.IO.File]::WriteAllLines($rc, [string[]]$kept)
              Write-Host "removed _authToken entries from ${rc} (OIDC mode needs no token)"
            }
          } catch {
            Write-Host "::warning::could not clean up .npmrc before OIDC publish: $($_.Exception.Message)"
          }

          Write-Host "no NPM_TOKEN secret: publishing ${env:PKG_NAME}@${env:PKG_VERSION} with OIDC trusted publishing"
          $raw = & npm publish $env:TARBALL --access public --provenance 2>&1
          $code = $LASTEXITCODE
          Write-Host ($raw | Out-String)

          if ($code -ne 0) {
            Write-Host "::error::npm publish failed with OIDC (exit ${code}). Nothing was published."
            Write-Host "This run had NO NPM_TOKEN secret, so npm fell back to OIDC trusted publishing."
            Write-Host "Pick ONE fix, then re-run this job:"
            Write-Host "  1) NPM_TOKEN (simplest): on npmjs.com create a Granular Access Token (read+write, public packages),"
            Write-Host "     then store it as the repository secret NPM_TOKEN (Settings -> Secrets and variables -> Actions)."
            Write-Host "  2) Trusted publishing (no secret at all): on npmjs.com open the package -> Settings -> Publishing access ->"
            Write-Host "     GitHub Actions, and enter owner '${env:REPO_OWNER}', repository '${env:REPO_NAME}', workflow filename 'publish-npm.yml', environment empty."
            Write-Host "Other possibilities:"
            Write-Host "  - 403 / EPRIVATE : the package may be restricted, or this repository is private (--provenance needs a public repo)."
            Write-Host "  - 404            : the package name/scope does not exist on npm yet; trusted publishing is configured per package."
            Write-Host "  - id-token       : the job must keep permissions: id-token: write (this workflow has it)."
            Write-Host "Node 24 ships npm 11, which supports trusted publishing."
            exit 1
          }
          Write-Host "${env:PKG_NAME}@${env:PKG_VERSION} is published to npm via OIDC."

      - name: Upload the tarball to the GitHub Release
        if: steps.exists.outputs.already != '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          TARBALL: ${{ steps.pack.outputs.file }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:RELEASE_TAG

          # 手动触发时 Release 可能还不存在。npm 那边已经发出去了，但"把资产
          # 挂到 Release"这一环确实失败了，所以要红掉并告诉用户怎么补。
          & gh release view $tag 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::no GitHub Release exists for tag '${tag}'; the npm package is published but no .tgz was attached."
            Write-Host "Fix: create a Release for '${tag}', then re-run this workflow from that Release;"
            Write-Host "     the idempotency gate will skip publishing and only attach the tarball."
            exit 1
          }

          & gh release upload $tag $env:TARBALL --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::the npm package is published, but attaching the tarball to release '${tag}' failed."
            Write-Host "Nothing on npm needs to change: re-run this workflow (the idempotency gate skips publishing),"
            Write-Host "or upload it manually: gh release upload '${tag}' <tgz> --clobber"
            exit 1
          }
          Write-Host "${env:TARBALL} is attached to release '${tag}'."
